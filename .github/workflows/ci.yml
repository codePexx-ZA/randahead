# CI: builds and checks the database, C# API, forecasting service and frontend on every push
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  database:
    name: Database (SQL runs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sme_budget
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d sme_budget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: budget
      PGPASSWORD: ci
      PGDATABASE: sme_budget
    steps:
      - uses: actions/checkout@v5
      - name: Run init scripts in order
        run: |
          for f in database/init/*.sql; do
            echo "Running $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: List tables
        run: psql -c "\dt"

  backend:
    name: C# API (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build backend/BudgetApi/BudgetApi.csproj -c Release -warnaserror

  forecasting:
    name: Forecasting (doctests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecasting
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: forecasting/requirements.txt
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run algorithm doctests
        run: python -m doctest app/algorithms.py
      - name: Check the API imports
        run: python -c "import app.main"

  frontend:
    name: Frontend (JS syntax + style rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          for f in frontend/js/*.js; do
            node --check "$f"
          done
      - name: No hard-coded colours outside base.css
        run: |
          if grep -nE '#[0-9a-fA-F]{3,8}\b' frontend/css/*.css | grep -v '^frontend/css/base.css:'; then
            echo "Use the CSS variables from base.css instead of hex colours."
            exit 1
          fi
      - name: No inline styles or scripts in HTML
        run: |
          if grep -nE 'style=|<style|<script>' frontend/*.html; then
            echo "Move inline styles and scripts into their own files."
            exit 1
          fi
